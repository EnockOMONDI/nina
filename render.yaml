services:
  - type: web
    name: ninatours
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: |
      echo "🚀 Starting nina build process..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "📦 Dependencies installed successfully"
      python3 manage.py collectstatic --noinput --settings=tours_travels.settings_prod
      echo "📁 Static files collected"
      python3 manage.py migrate --settings=tours_travels.settings_prod
      echo "🗄️ Database migrations applied"
      python3 manage.py createcachetable --settings=tours_travels.settings_prod
      echo "💾 Cache table created"
      echo "✅ Build completed successfully"
    startCommand: |
      echo "🌟 Starting nina Travel web server..."
      gunicorn tours_travels.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers ${WEB_CONCURRENCY:-1} \
        --timeout ${GUNICORN_TIMEOUT:-120} \
        --worker-class sync \
        --worker-connections 1000 \
        --max-requests 1000 \
        --max-requests-jitter 100 \
        --access-logfile - \
        --error-logfile - \
        --log-level info
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tours_travels.settings_prod
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: nina-50ni.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ziadatravel-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: 0
      - key: DB_CONN_HEALTH_CHECKS
        value: True
      - key: EMAIL_PROVIDER
        value: smtp
      - key: DEFAULT_FROM_EMAIL
        value: Nina Tours and Travel <kipekee254@gmail.com>
      - key: ADMIN_EMAIL
        value: info@ninatoursandtravel.com
      - key: EXTRA_EMAIL_RECIPIENTS
        value: ""
      - key: SITE_URL
        value: https://nina-50ni.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: ""
      - key: BREVO_SENDER_NAME
        value: ""
      - key: EMAIL_TIMEOUT
        value: 10

databases:
  - name: ziadatravel-db
    databaseName: ziadatravel
    user: ziadatravel_user
    region: frankfurt
    plan: free
    postgresMajorVersion: 15
